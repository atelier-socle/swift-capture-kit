coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 90%

ignore:
  # Session 11 — Real Apple audio framework implementations (require hardware)
  - "Sources/CaptureKit/Source/Audio/SystemAudioCaptureEngine.swift"
  - "Sources/CaptureKit/Source/Audio/SystemAudioFileReader.swift"
  - "Sources/CaptureKit/Source/Audio/SCStreamAudioProvider.swift"
  - "Sources/CaptureKit/Encoder/Audio/AudioToolboxEncoder.swift"
  # Session 12 — Real Apple video framework implementations (require hardware)
  - "Sources/CaptureKit/Source/Video/SystemVideoCaptureEngine.swift"
  - "Sources/CaptureKit/Source/Video/SystemVideoFileReader.swift"
  - "Sources/CaptureKit/Encoder/Video/VideoToolboxEncoder.swift"
  # Session 13 — Real screen capture implementations (require hardware/permissions)
  - "Sources/CaptureKit/Source/Screen/SCStreamVideoProvider.swift"
  - "Sources/CaptureKit/Source/Screen/ReplayKitVideoProvider.swift"
  # Session 13 — SwiftUI views (require UI testing)
  - "Sources/CaptureKit/Permission/UI/CapturePermissionView.swift"
  - "Sources/CaptureKit/Permission/UI/CapturePermissionModifier.swift"
  # Session 14 — Real Apple framework implementations (require hardware/permissions)
  - "Sources/CaptureKit/Output/File/AVAssetWriterEngine.swift"
  - "Sources/CaptureKit/Output/Utility/SystemAudioPlaybackEngine.swift"
  - "Sources/CaptureKit/Source/Discovery/DeviceDiscovery.swift"
  # Real-time generator sources (Task.sleep loops, tested locally only)
  - "Sources/CaptureKit/Source/Audio/ToneSource.swift"
  - "Sources/CaptureKit/Source/Audio/SilenceSource.swift"
  - "Sources/CaptureKit/Source/Video/BlackSource.swift"
  - "Sources/CaptureKit/Source/Video/ColorSource.swift"
  - "Sources/CaptureKit/Source/Video/TestPatternSource.swift"
