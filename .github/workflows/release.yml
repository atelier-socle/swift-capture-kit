# release.yml — Build XCFramework and publish on tag push.
#
# Triggers on semver tags WITHOUT "v" prefix (e.g. 0.1.0, 1.2.3).
# Builds CaptureKit.xcframework for all supported platforms
# (macOS, iOS, iOS Simulator, visionOS, visionOS Simulator)
# in both Release and Debug configurations, with dSYMs included.

name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: swift-capture-kit
  FRAMEWORK_NAME: CaptureKit

jobs:
  # ---------- Build XCFramework ----------
  build-xcframework:
    name: "Build XCFramework"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Swift version
        run: swift --version

      - name: Create output directories
        run: mkdir -p archives xcframework-release xcframework-debug

      # ---------- Release archives ----------
      - name: Archive macOS (Release)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=macOS" \
            -archivePath archives/macos-release \
            -configuration Release \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive iOS (Release)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath archives/ios-release \
            -configuration Release \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive iOS Simulator (Release)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -archivePath archives/ios-simulator-release \
            -configuration Release \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive visionOS (Release)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=visionOS" \
            -archivePath archives/visionos-release \
            -configuration Release \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive visionOS Simulator (Release)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=visionOS Simulator" \
            -archivePath archives/visionos-simulator-release \
            -configuration Release \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      # ---------- Debug archives ----------
      - name: Archive macOS (Debug)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=macOS" \
            -archivePath archives/macos-debug \
            -configuration Debug \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive iOS (Debug)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath archives/ios-debug \
            -configuration Debug \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive iOS Simulator (Debug)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -archivePath archives/ios-simulator-debug \
            -configuration Debug \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive visionOS (Debug)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=visionOS" \
            -archivePath archives/visionos-debug \
            -configuration Debug \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive visionOS Simulator (Debug)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=visionOS Simulator" \
            -archivePath archives/visionos-simulator-debug \
            -configuration Debug \
            -skipPackagePluginValidation \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      # ---------- Create XCFrameworks ----------
      - name: Create Release XCFramework
        run: |
          xcodebuild -create-xcframework \
            -archive archives/macos-release.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -archive archives/ios-release.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -archive archives/ios-simulator-release.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -archive archives/visionos-release.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -archive archives/visionos-simulator-release.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -output xcframework-release/"$FRAMEWORK_NAME.xcframework"

      - name: Create Debug XCFramework
        run: |
          xcodebuild -create-xcframework \
            -archive archives/macos-debug.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -archive archives/ios-debug.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -archive archives/ios-simulator-debug.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -archive archives/visionos-debug.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -archive archives/visionos-simulator-debug.xcarchive -framework "$FRAMEWORK_NAME.framework" \
            -output xcframework-debug/"$FRAMEWORK_NAME.xcframework"

      # ---------- Collect dSYMs ----------
      - name: Collect dSYMs
        run: |
          mkdir -p dsyms
          for archive in archives/*.xcarchive; do
            if [ -d "$archive/dSYMs" ]; then
              cp -r "$archive/dSYMs/"* dsyms/ 2>/dev/null || true
            fi
          done

      # ---------- Package artifacts ----------
      - name: Package Release XCFramework
        run: |
          cd xcframework-release
          zip -r -y "../$FRAMEWORK_NAME-release.xcframework.zip" "$FRAMEWORK_NAME.xcframework"

      - name: Package Debug XCFramework
        run: |
          cd xcframework-debug
          zip -r -y "../$FRAMEWORK_NAME-debug.xcframework.zip" "$FRAMEWORK_NAME.xcframework"

      - name: Package dSYMs
        run: |
          cd dsyms
          zip -r -y "../$FRAMEWORK_NAME-dSYMs.zip" . 2>/dev/null || echo "No dSYMs found"

      - name: Upload Release XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: CaptureKit-release-xcframework
          path: CaptureKit-release.xcframework.zip

      - name: Upload Debug XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: CaptureKit-debug-xcframework
          path: CaptureKit-debug.xcframework.zip

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: CaptureKit-dSYMs
          path: CaptureKit-dSYMs.zip
          if-no-files-found: ignore

  # ---------- GitHub Release ----------
  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [build-xcframework]
    steps:
      - uses: actions/checkout@v4

      - name: Download Release XCFramework
        uses: actions/download-artifact@v4
        with:
          name: CaptureKit-release-xcframework
          path: artifacts

      - name: Download Debug XCFramework
        uses: actions/download-artifact@v4
        with:
          name: CaptureKit-debug-xcframework
          path: artifacts

      - name: Download dSYMs
        uses: actions/download-artifact@v4
        with:
          name: CaptureKit-dSYMs
          path: artifacts
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/CaptureKit-release.xcframework.zip
            artifacts/CaptureKit-debug.xcframework.zip
            artifacts/CaptureKit-dSYMs.zip
