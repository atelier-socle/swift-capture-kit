# release.yml — Create GitHub Release on tag push.
#
# Triggers on semver tags WITHOUT "v" prefix (e.g. 0.1.0, 1.2.3).
# SPM library — users pull source via Swift Package Manager.

name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Swift Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        timeout-minutes: 5
        run: |
          swift test > /tmp/test-output.log 2>&1 &
          PID=$!
          sleep 120
          kill -9 $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          cat /tmp/test-output.log
          grep "Test run with" /tmp/test-output.log | grep -q "pass"

  release:
    name: "Create Release"
    runs-on: macos-26
    needs: build-and-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
