# ci.yml — Continuous Integration for swift-capture-kit.
#
# Runs lint, build, test (with coverage), and platform builds.
# Apple platforms only — no Linux, no tvOS, no watchOS.
#
# Note: swift test hangs on exit on macos-26 runners due to a Swift
# concurrency runtime bug (AVFoundation/CoreAudio related). Test and
# coverage are separate steps — coverage runs best-effort in background.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Lint ----------
  lint:
    name: "Lint"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Install swift-format
        run: brew install swift-format
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: swift-format
        run: swift-format lint -r Sources/ Tests/

  # ---------- Build & Test (macOS) ----------
  build-and-test:
    name: "macOS (Swift 6.2)"
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Swift Version
        run: swift --version
      - name: Test with Coverage
        timeout-minutes: 5
        env:
          LLVM_PROFILE_FILE: /tmp/capturekit-%m%c.profraw
        run: |
          swift test --enable-code-coverage > /tmp/test-output.log 2>&1 &
          PID=$!
          sleep 120
          kill -9 $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          cat /tmp/test-output.log
          grep "Test run with" /tmp/test-output.log | grep -q "pass"
      - name: Coverage Report
        if: always()
        run: |
          TEST_BIN=$(find .build -name "swift-capture-kitPackageTests" -type f ! -name "*.o" -not -path "*.dSYM*" 2>/dev/null | head -1)
          # Check /tmp first (continuous mode), then .build (SwiftPM default)
          if ls /tmp/capturekit-*.profraw 1>/dev/null 2>&1; then
            echo "Found profraw in /tmp (continuous mode)"
            xcrun llvm-profdata merge -sparse /tmp/capturekit-*.profraw -o /tmp/merged.profdata
          elif ls .build/debug/codecov/*.profraw 1>/dev/null 2>&1; then
            echo "Found profraw in .build (SwiftPM default)"
            xcrun llvm-profdata merge -sparse .build/debug/codecov/*.profraw -o /tmp/merged.profdata
          else
            echo "No profraw files found anywhere"
            find .build -name "*.profraw" 2>/dev/null
            ls /tmp/*.profraw 2>/dev/null
          fi
          if [ -f /tmp/merged.profdata ] && [ -n "$TEST_BIN" ]; then
            xcrun llvm-cov report "$TEST_BIN" \
              -instr-profile=/tmp/merged.profdata \
              -ignore-filename-regex='\.build|Tests'
          fi
      - name: Generate lcov
        if: always()
        run: |
          TEST_BIN=$(find .build -name "swift-capture-kitPackageTests" -type f ! -name "*.o" -not -path "*.dSYM*" 2>/dev/null | head -1)
          if [ -f /tmp/merged.profdata ] && [ -n "$TEST_BIN" ]; then
            xcrun llvm-cov export "$TEST_BIN" \
              -instr-profile=/tmp/merged.profdata \
              -format=lcov \
              -ignore-filename-regex='\.build|Tests' \
              > coverage.lcov
          fi
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------- Platform Builds (library only) ----------
  platform-builds:
    name: "${{ matrix.platform }}"
    runs-on: macos-26
    needs: lint
    strategy:
      matrix:
        include:
          - platform: iOS
            destination: "generic/platform=iOS Simulator"
          - platform: visionOS
            destination: "generic/platform=visionOS Simulator"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme swift-capture-kit \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
